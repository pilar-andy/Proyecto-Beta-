<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9276ff"/>
      <stop offset="1" stop-color="#3a86ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".12" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx=".15" cy=".95" r=".7">
      <stop offset="0" stop-color="#f06ac4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f06ac4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#241a8c" flood-opacity=".38"/>
    </filter>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <clipPath id="r"><rect width="1024" height="1024" rx="228"/></clipPath>
  <g clip-path="url(#r)"><rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#warm)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/></g>

  <!-- Marca -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="212" fill="none" stroke="#fff" stroke-width="96" stroke-linecap="round"
            stroke-dasharray="1040 292" transform="rotate(-10 512 512)"/>
    <circle cx="512" cy="512" r="64" fill="#fff"/>
    <circle cx="650" cy="351" r="42" fill="#fff"/>
  </g>
  <circle cx="650" cy="351" r="42" fill="#fff" opacity=".55" filter="url(#halo)"/>
</svg>
